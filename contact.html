<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIRECTOR MARKET — CONTACT</title>
    <meta name="description" content="디렉터마켓에 프로젝트를 문의하세요. 세상을 바꾸는 아이디어를 함께 만듭니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.1">
</head>

<body class="contact-page">

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <img src="img/logo_white.png" alt="Director Market Logo" class="nav-logo-img">
            </a>
            <div class="nav-links">
                <a href="index.html#hero" class="nav-link">ABOUT</a>
                <a href="work.html" class="nav-link">WORK</a>
                <a href="blog.html" class="nav-link">BLOG</a>
                <a href="contact.html" class="nav-link active cta-link">CONTACT</a>
            </div>
        </div>
    </nav>
 
    <!-- Hero Section -->
    <section class="contact-hero">
        <div class="hero-overlay"></div>
        <div class="contact-hero-content">
            <h1 class="contact-main-title">
                <span style="animation-duration: 5.2s; animation-delay: 0.1s;">C</span>
                <span style="animation-duration: 7.8s; animation-delay: 0.8s;">O</span>
                <span style="animation-duration: 6.4s; animation-delay: 1.5s;">N</span>
                <span style="animation-duration: 8.2s; animation-delay: 0.3s;">T</span>
                <span style="animation-duration: 5.9s; animation-delay: 1.1s;">A</span>
                <span style="animation-duration: 6.7s; animation-delay: 1.9s;">C</span>
                <span style="animation-duration: 7.3s; animation-delay: 0.6s;">T</span>
            </h1>
        </div>
    </section>
    <!-- Project Inquiry Form Section -->
    <section class="section section-inquiry">
            <!-- Large Decorative Planets -->
            <div class="inquiry-planet inquiry-planet-left">
                <img src="assets/planets/earth_hd.png" alt="Earth">
            </div>
            <div class="inquiry-planet inquiry-planet-right">
                <img src="assets/planets/moon_hd.png" alt="Moon">
            </div>

            <form class="contact-form">
                <div id="formSuckTarget" class="inquiry-form-grid">
                    <div class="form-group form-half">
                        <label for="affiliation">소속</label>
                        <input type="text" id="affiliation" name="affiliation">
                    </div>
                    <div class="form-group form-half">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group form-full">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group form-full">
                        <label for="phone">전화번호</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group form-full">
                        <label for="project-desc">프로젝트 내용</label>
                        <textarea id="project-desc" name="project-desc" required placeholder="내용을 입력해주세요."></textarea>
                    </div>
                </div>

                <div class="form-submit">
                    <!-- Hidden actual submit button -->
                    <button type="submit" id="actualSubmitBtn" style="display: none;"></button>
                    
                    <div class="submit-container submit-container-centered">
                        <!-- Custom Drag Slider -->
                        <div class="submit-slider" id="submitSlider">
                            <div class="submit-track" id="submitTrack">
                                <span class="submit-text">문의하기</span>
                            </div>
                            <div class="submit-thumb" id="submitThumb">
                                <img src="img/astronaut_neon.png" alt="Drag" class="astronaut-img" draggable="false" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <svg class="astronaut-svg" style="display: none;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="50" cy="50" r="45" fill="#111" stroke="white" stroke-width="4"/>
                                    <path d="M30 85 C30 65, 70 65, 70 85" stroke="white" stroke-width="4" stroke-linecap="round"/>
                                    <rect x="25" y="35" width="50" height="40" rx="20" stroke="white" stroke-width="4"/>
                                    <circle cx="50" cy="45" r="25" fill="#0a0a0f" stroke="white" stroke-width="4"/>
                                    <path d="M35 45 Q50 30 65 45" stroke="white" stroke-width="4" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
    </section>

    <!-- Map & Location Section -->
    <section class="section section-location">
        <div class="location-container">
            <h2 class="location-title">지구 본사<br>찾아오는길</h2>
            
            <div class="map-wrapper">
                <iframe 
                    class="map-iframe"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3163.593796277686!2d127.045869!3d37.545814!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDMyJzQ0LjkiTiAxMjfCsDAyJzQ1LjEiRQ!5e0!3m2!1sko!2skr!4v1711770000000!5m2!1sko!2skr&q=서울특별시+성동구+성수일로+99" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="location-info">
                <h3>ADDRESS</h3>
                <p>서울특별시 성동구 성수일로 99, 509호 (성수동2가, 서울숲AK밸리)</p>
                
                <div class="location-details">
                    <div class="loc-item">
                        <span class="loc-label">T.</span>
                        <span class="loc-value">02-1234-5678</span>
                    </div>
                    <div class="loc-item">
                        <span class="loc-label">E.</span>
                        <span class="loc-value">hello@directormarket.com</span>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="app.js"></script>
</body>

</html>
